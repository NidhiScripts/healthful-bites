<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" fill="none">
  <defs>
    <!-- Top Leaves & Heart Green Gradient -->
    <linearGradient id="primaryGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="45%" stop-color="#4ade80" />
      <stop offset="75%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Darker Green for Bottom Leaf Swoop -->
    <linearGradient id="bottomLeafGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="60%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <!-- Spoon Teal Gradient -->
    <linearGradient id="spoonTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="40%" stop-color="#0d9488" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Subtle Vein White Glow -->
    <linearGradient id="leafVein" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- TOP LEAVES -->
  <!-- Left Large Leaf -->
  <g>
    <path
      d="M276 195 C230 145 200 65 205 15 C260 20 300 70 295 155 Z"
      fill="url(#primaryGreen)"
    />
    <path
      d="M276 190 C258 135 240 75 220 30"
      stroke="url(#leafVein)"
      stroke-width="5"
      stroke-linecap="round"
    />
  </g>

  <!-- Right Small Leaf -->
  <g>
    <path
      d="M295 190 C300 145 325 100 370 100 C375 140 355 180 305 195 Z"
      fill="url(#primaryGreen)"
    />
    <path
      d="M305 190 C322 160 342 135 362 110"
      stroke="url(#leafVein)"
      stroke-width="4.5"
      stroke-linecap="round"
    />
  </g>

  <!-- MAIN HEART APPLE OUTLINE -->
  <path
    d="M288 250 
       C265 210 200 185 145 225 
       C85 270 95 360 160 425 
       C205 470 235 495 242 505 
       C238 480 200 440 170 405 
       C120 350 115 285 160 250 
       C205 215 260 235 288 285 
       L289 285 
       C318 235 372 215 418 250 
       C462 285 458 350 435 390 
       C428 402 418 412 415 415 
       C425 398 438 375 440 355 
       C445 300 415 240 372 215 
       C322 185 298 225 288 250 Z"
    fill="url(#primaryGreen)"
  />

  <!-- SPOON (TEAL/CYAN) -->
  <g>
    <path
      d="M225 540 
         C235 500 270 460 335 425 
         L348 418 
         C332 428 300 458 245 540 Z"
      fill="url(#spoonTeal)"
    />
    
    <path
      d="M226 538 C265 478 320 440 348 420 L355 432 C325 452 275 490 238 545 Z"
      fill="url(#spoonTeal)"
    />

    <ellipse
      cx="378"
      cy="375"
      rx="44"
      ry="28"
      transform="rotate(-38 378 375)"
      fill="url(#spoonTeal)"
    />
  </g>

  <!-- BOTTOM-RIGHT LEAF SWOOP -->
  <path
    d="M250 540 
       C270 495 320 465 375 475 
       C425 485 455 440 462 335 
       C465 405 440 480 385 520 
       C340 550 285 550 250 540 Z"
    fill="url(#bottomLeafGreen)"
  />
</svg>
